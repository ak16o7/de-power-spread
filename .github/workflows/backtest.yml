name: Backtest

# Weekly: refresh data, rerun explain, the walk-forward backtest and every robustness
# variant, commit reports and README.
on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: |
            data
            ~/.cache/huggingface
          key: dps-data-${{ github.run_id }}
          restore-keys: dps-data-
      - run: pip install -r requirements.txt
      - run: python -m dps fetch --recent-days 14
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          NTP_CLIENT_ID: ${{ secrets.NTP_CLIENT_ID }}
          NTP_CLIENT_SECRET: ${{ secrets.NTP_CLIENT_SECRET }}
      - run: python -m dps run --robustness
      - name: Commit
        run: |
          git config user.name "ak16o7"
          git config user.email "akderekaan@hotmail.com"
          git add reports README.md
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "backtest: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
