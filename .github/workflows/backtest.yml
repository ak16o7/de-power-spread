name: Backtest

# Weekly: refresh data, rerun explain, the walk-forward backtest and every robustness
# variant, commit reports and README. Started on Sundays at 07:00 local by the same external
# scheduler as the live signal (workflow_dispatch API). No GitHub cron: unlike a missed
# signal, a missed week costs nothing and is caught up the next Sunday, and a second
# trigger would only run the same 1-2 h twice.
on:
  workflow_dispatch:

permissions:
  contents: write

# Own group, not the live one: GitHub starts scheduled runs late, sometimes by hours, and a
# 1-2 h backtest must never hold up the signal. Both commit steps rebase and retry instead.
concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v4
        with:
          path: |
            data
            ~/.cache/huggingface
          key: dps-data-${{ github.run_id }}
          restore-keys: dps-data-
      - run: pip install -r requirements.txt
      - run: python -m dps fetch --recent-days 14
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          NTP_CLIENT_ID: ${{ secrets.NTP_CLIENT_ID }}
          NTP_CLIENT_SECRET: ${{ secrets.NTP_CLIENT_SECRET }}
      - run: python -m dps run --robustness
      - name: Commit
        run: |
          git config user.name "ak16o7"
          git config user.email "akderekaan@hotmail.com"
          git add reports README.md
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "backtest: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
