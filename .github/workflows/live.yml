name: Live

# Signal for tomorrow before the 12:00 day-ahead auction, and settlement of earlier days.
# GitHub cron runs in UTC and is often late, so the signal job has a slot every ten
# minutes across 10:45-11:50 local in both summer (UTC+2) and winter time (UTC+1).
# `dps status` decides cheaply whether a signal is due; only the first slot inside the
# window does the work. A signal finished after 11:50 is marked late and never counted.
# The push of signals/YYYY-MM-DD.* and this run's log are the timestamped public record
# (a commit date alone can be set by whoever commits).
on:
  schedule:
    - cron: "45,55 8 * * *"              # 10:45-10:55 CEST
    - cron: "5,15,25,35,45,55 9 * * *"   # 11:05-11:55 CEST | 10:05-10:55 CET
    - cron: "5,15,25,35,45 10 * * *"     # 11:05-11:45 CET
    - cron: "23 16 * * *"                # settlement only (yesterday's ID-AEP is out by then)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Is a signal due?
        id: gate
        # a queued run was created before the previous run pushed: look at the newest state
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}"
          python -m dps status --github-output
      - name: Restore data cache
        if: steps.gate.outputs.due == 'true' || github.event.schedule == '23 16 * * *'
        uses: actions/cache@v4
        with:
          path: |
            data
            ~/.cache/huggingface
          key: dps-data-${{ github.run_id }}
          restore-keys: dps-data-
      - name: Fetch prices, load, ID-AEP
        if: steps.gate.outputs.due == 'true' || github.event.schedule == '23 16 * * *'
        run: python -m dps fetch --recent-days 10
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          NTP_CLIENT_ID: ${{ secrets.NTP_CLIENT_ID }}
          NTP_CLIENT_SECRET: ${{ secrets.NTP_CLIENT_SECRET }}
      - name: Signal for tomorrow
        if: steps.gate.outputs.due == 'true'
        run: python -m dps signal
      - name: Settle earlier signals
        if: steps.gate.outputs.due == 'true' || github.event.schedule == '23 16 * * *'
        run: python -m dps settle
      - name: Commit
        if: steps.gate.outputs.due == 'true' || github.event.schedule == '23 16 * * *'
        run: |
          git config user.name "ak16o7"
          git config user.email "akderekaan@hotmail.com"
          git add signals live README.md
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "live: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
