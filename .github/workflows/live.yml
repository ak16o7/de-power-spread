name: Live

# Signal for tomorrow before the 12:00 day-ahead auction, settlement of earlier days.
# GitHub cron runs in UTC and can be late, so there are several slots; `signal` only
# writes inside 10:45-11:50 local and only once per day (CEST: first two slots,
# CET: last two). The commit of signals/YYYY-MM-DD.* is the timestamped record.
on:
  schedule:
    - cron: "50 8 * * *"    # 10:50 CEST | 09:50 CET (too early in winter)
    - cron: "12 9 * * *"    # 11:12 CEST | 10:12 CET (too early in winter)
    - cron: "48 9 * * *"    # 11:48 CEST | 10:48 CET
    - cron: "12 10 * * *"   # 12:12 CEST (too late) | 11:12 CET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            data
            ~/.cache/huggingface
          key: dps-data-${{ github.run_id }}
          restore-keys: dps-data-
      - run: pip install -r requirements.txt
      - name: Fetch prices, load, ID-AEP
        run: python -m dps fetch --recent-days 10
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          NTP_CLIENT_ID: ${{ secrets.NTP_CLIENT_ID }}
          NTP_CLIENT_SECRET: ${{ secrets.NTP_CLIENT_SECRET }}
      - name: Signal for tomorrow
        run: python -m dps signal
      - name: Settle earlier signals
        run: python -m dps settle
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals live README.md
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "live: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
